# XcodeGen 工程描述：改完运行 `xcodegen generate` 重新生成 YueTing.xcodeproj
name: YueTing
options:
  bundleIdPrefix: com.chenwei54
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # 个人免费开发者账号；换账号时改这里
    DEVELOPMENT_TEAM: HF6J64BKT7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YueTing:
    type: application
    platform: iOS
    sources: [YueTing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenwei54.yueting
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: YueTing/Info.plist
      properties:
        CFBundleDisplayName: 小狗音乐
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 后台继续播放
        UIBackgroundModes: [audio]
        # 在线查不到歌词时，用本机语音识别从歌声生成歌词
        NSSpeechRecognitionUsageDescription: 在线歌词库里找不到歌词时，小狗音乐会在手机上识别歌曲里的人声来生成歌词，音频不会上传。
        # 让 App 的 Documents 出现在「文件 › 我的 iPhone › 小狗音乐」，电脑 Finder 也能直接拖歌进来
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 在「文件」等 App 里对音频选「用小狗音乐打开」
        CFBundleDocumentTypes:
          - CFBundleTypeName: 音频
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac, com.microsoft.waveform-audio]
  # 界面自动化测试；曲库里需要事先放好歌（模拟器用 simctl 把音频拷进 App 的 Documents）
  YueTingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YueTingUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenwei54.yueting.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YueTing
    dependencies:
      - target: YueTing
schemes:
  YueTing:
    build:
      targets:
        YueTing: all
        YueTingUITests: [test]
    test:
      targets: [YueTingUITests]
